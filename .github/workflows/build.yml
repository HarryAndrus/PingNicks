name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            fabric_api: "0.139.5+1.21.11"
            java: "21"
          - mc: "1.21.8"
            fabric_api: "0.136.0+1.21.8"
            java: "21"
          - mc: "1.20.4"
            fabric_api: "0.97.0+1.20.4"
            java: "17"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"
      - name: Build for Minecraft ${{ matrix.mc }}
        run: >
          gradle build --no-daemon
          -Pminecraft_version=${{ matrix.mc }}
          -Pfabric_api_version=${{ matrix.fabric_api }}
          -Pjava_version=${{ matrix.java }}
      - uses: actions/upload-artifact@v4
        with:
          name: team-nicknames-mc${{ matrix.mc }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
